name: DOS Windows Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 Release
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Locate DOS source tree
        id: locate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_WORKSPACE

          $candidate = Get-ChildItem -LiteralPath $repo -Recurse -File -Filter 'dos.cpp' |
            Where-Object {
              $_.FullName -match '\\src\\dos\.cpp$' -and
              $_.FullName -notmatch '\\tests(\\|$)' -and
              $_.FullName -notmatch '\\(?:build[^\\]*|dist|\.git)(\\|$)'
            } |
            Sort-Object @{ Expression = { $_.FullName.Length }; Ascending = $true } |
            Select-Object -First 1

          if ($null -eq $candidate) {
            throw 'src\dos.cpp was not found.'
          }

          $projectRoot = $candidate.Directory.Parent.FullName
          $source = $candidate.FullName

          Write-Host "Project root: $projectRoot"
          Write-Host "Source:       $source"

          "project_root=$projectRoot" >> $env:GITHUB_OUTPUT
          "source=$source" >> $env:GITHUB_OUTPUT

      - name: Build DOS with MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $source = '${{ steps.locate.outputs.source }}'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'

          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Missing source file: $source"
          }

          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1).Trim()
          if ([string]::IsNullOrWhiteSpace($vsPath)) {
            throw 'Visual Studio x64 C++ tools were not found.'
          }

          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars -PathType Leaf)) {
            throw "vcvars64.bat was not found: $vcvars"
          }

          $output = Join-Path $dist 'dos.exe'
          $compatHeader = Join-Path $env:RUNNER_TEMP 'dos-msvc-compat.hpp'
          $windowsSource = Join-Path $env:RUNNER_TEMP 'dos.windows.cpp'

          # Do not modify the repository source. The temporary source performs
          # only the two MSVC compatibility substitutions actually required by
          # the checked-in source:
          #   std::iswspace(c) -> ::iswspace(c)
          #   _environ        -> dos_ci_environ_ptr
          # The second replacement uses a real char** variable, not a function
          # substitution, so MSVC cannot produce char* -> char** conversion errors.
          $compat = @'
          #pragma once
          #ifndef NOMINMAX
          #define NOMINMAX
          #endif
          #include <windows.h>
          #include <cstdlib>
          #include <cstring>
          #include <string>
          #include <vector>

          static char** dos_ci_make_environ() {
              static std::vector<std::string> entries;
              static std::vector<char*> pointers;
              entries.clear();
              pointers.clear();

              LPCH block = ::GetEnvironmentStringsA();
              if (block == nullptr) {
                  pointers.push_back(nullptr);
                  return pointers.data();
              }

              for (LPCH p = block; *p != '\0'; p += std::strlen(p) + 1) {
                  entries.emplace_back(p);
              }
              ::FreeEnvironmentStringsA(block);

              pointers.reserve(entries.size() + 1);
              for (std::string& entry : entries) {
                  pointers.push_back(entry.data());
              }
              pointers.push_back(nullptr);
              return pointers.data();
          }

          static char** dos_ci_environ_ptr = dos_ci_make_environ();
          '@
          Set-Content -LiteralPath $compatHeader -Value $compat -Encoding ASCII

          $sourceText = Get-Content -LiteralPath $source -Raw -Encoding UTF8
          if (-not $sourceText.Contains('std::iswspace')) {
            throw 'The checked-out source no longer contains std::iswspace; CI compatibility assumptions need review.'
          }
          if (-not $sourceText.Contains('_environ')) {
            throw 'The checked-out source no longer contains _environ; CI compatibility assumptions need review.'
          }

          $patchedSource = $sourceText
          $patchedSource = $patchedSource.Replace('std::iswspace', '::iswspace')
          $patchedSource = $patchedSource.Replace('_environ', 'dos_ci_environ_ptr')

          if (-not $patchedSource.Contains('::iswspace')) {
            throw 'MSVC shim substitution for std::iswspace failed.'
          }
          if (-not $patchedSource.Contains('char** environment = dos_ci_environ_ptr')) {
            throw 'MSVC shim substitution for _environ failed.'
          }

          # Write UTF-8 without a BOM; MSVC accepts this consistently with /utf-8.
          [System.IO.File]::WriteAllText($windowsSource, $compat + "`r`n" + $patchedSource, [System.Text.UTF8Encoding]::new($false))

          Write-Host 'MSVC compatibility source generated.'
          Write-Host '  std::iswspace -> ::iswspace'
          Write-Host '  _environ      -> dos_ci_environ_ptr (char** variable)'
          Write-Host "  temporary source: $windowsSource"

          $compile = @"
          call "$vcvars"
          if errorlevel 1 exit /b %errorlevel%
          set "CL="
          cl.exe /nologo /std:c++20 /EHsc /permissive- /utf-8 /W4 /WX /O2 /GL /Gy /Gw /D_CRT_SECURE_NO_WARNINGS /DDOS_VERSION_MAJOR=1 /DDOS_VERSION_MINOR=0 "$windowsSource" /Fe:"$output" /link /LTCG /OPT:REF /OPT:ICF /GUARD:CF /DYNAMICBASE /NXCOMPAT advapi32.lib iphlpapi.lib ws2_32.lib shell32.lib
          if errorlevel 1 exit /b %errorlevel%
          "@

          $tempBat = Join-Path $env:RUNNER_TEMP 'build-dos.bat'
          Set-Content -LiteralPath $tempBat -Value $compile -Encoding ASCII

          & cmd.exe /d /s /c "`"$tempBat`""
          if ($LASTEXITCODE -ne 0) {
            throw "MSVC build failed with exit code $LASTEXITCODE"
          }

          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) {
            throw 'dos.exe was not produced.'
          }

      - name: Collect runtime files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projectRoot = '${{ steps.locate.outputs.project_root }}'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'

          foreach ($relative in @(
            'install_association.bat',
            'build_windows.bat',
            'build_windows_llvm_mingw.bat',
            'hello.dos'
          )) {
            $source = Join-Path $projectRoot $relative
            if (Test-Path -LiteralPath $source -PathType Leaf) {
              Copy-Item -LiteralPath $source -Destination $dist -Force
            }
          }

          $plugins = Join-Path $projectRoot 'plugins'
          if (Test-Path -LiteralPath $plugins -PathType Container) {
            Copy-Item -LiteralPath $plugins -Destination $dist -Recurse -Force
          }

          # Tests and local build products are never included in the runtime artifact.
          foreach ($name in @('tests', 'build', 'build-final', 'build-stage4-release', 'build-asan')) {
            $path = Join-Path $dist $name
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
          }

      - name: Verify Windows PE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\dos.exe'
          $bytes = [System.IO.File]::ReadAllBytes($exe)

          if ($bytes.Length -lt 0x100) { throw 'dos.exe is too small.' }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Missing MZ signature.' }

          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 0 -or $peOffset + 24 -gt $bytes.Length) { throw 'Invalid PE offset.' }
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or $bytes[$peOffset + 2] -ne 0 -or $bytes[$peOffset + 3] -ne 0) {
            throw 'Missing PE signature.'
          }

          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw ('Unexpected PE machine: 0x{0:X4}' -f $machine) }

          $magic = [BitConverter]::ToUInt16($bytes, $peOffset + 24)
          if ($magic -ne 0x20B) { throw ('Unexpected optional-header magic: 0x{0:X4}' -f $magic) }

          Write-Host 'PE32+ x64 validation: PASS'

      - name: Smoke launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\dos.exe'
          & $exe --version
          if ($LASTEXITCODE -ne 0) {
            throw "dos.exe --version failed with exit code $LASTEXITCODE"
          }

      - name: Verify tests are excluded
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $forbidden = Get-ChildItem -LiteralPath $dist -Recurse -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\tests(\\|$)' }
          if ($forbidden) {
            throw 'Test files were included in the runtime distribution.'
          }
          Write-Host 'Test exclusion: PASS'

      - name: Create Windows distribution archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $archive = Join-Path $env:GITHUB_WORKSPACE 'DOS-Windows-x64.zip'
          if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
          Compress-Archive -Path (Join-Path $dist '*') -DestinationPath $archive -CompressionLevel Optimal

      - name: Upload Windows runtime
        uses: actions/upload-artifact@v7
        with:
          name: DOS-Windows-x64
          path: |
            dist/**
            DOS-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
